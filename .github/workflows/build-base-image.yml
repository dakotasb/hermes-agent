name: Build base image (kiri)

# Builds + publishes the Hermes base image consumed by the kiri-os Fly backend
# (its combined Dockerfile does `FROM ghcr.io/dakotasb/hermes-agent:prod`).
#
# Why a separate workflow: the upstream `docker-publish.yml` is gated to
# `if: github.repository == 'NousResearch/hermes-agent'` (skips on this fork)
# and targets the `nousresearch` namespace on `main`. This one is additive and
# fork-specific, so daily `hermes update` merges from upstream never touch it.
#
# Cost: public repo => free Actions minutes; public ghcr package => free
# storage + egress. gha layer cache keeps rebuilds fast.

on:
  push:
    branches: [kiri-customizations]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile'
      - 'docker/**'
      - '.github/workflows/build-base-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-base-${{ github.ref }}
  cancel-in-progress: false   # every push gets its own image

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/dakotasb/hermes-agent:prod
            ghcr.io/dakotasb/hermes-agent:${{ github.sha }}
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false   # simple single-manifest image for a clean FROM pull
